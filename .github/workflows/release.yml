name: Release

# Dispara ao empurrar uma tag "vX.Y.Z" (ex: v0.1.0) na mão — publica um GitHub Release com o
# tarball da release + um manifesto self-update.json (ver tools/make-release.sh). Caminho
# manual, pra quem quiser cravar um bump de minor/major de propósito; o dia a dia (patch a
# cada merge em main) passa por .github/workflows/auto-release.yml, que chama o mesmo script.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publica o GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/make-release.sh "${GITHUB_REF_NAME}"
